name: Controlla i tip

on:
  pull_request:
    paths:
      - "tips/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py --check
